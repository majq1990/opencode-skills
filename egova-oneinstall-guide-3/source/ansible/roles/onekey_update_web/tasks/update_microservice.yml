---

- block:
  - name: 备份jar文件
    copy:
      src: "{{ deploy_path }}/{{ jar_name }}"
      dest: "{{ deploy_update_path }}/backup_{{ timestamp }}/{{ app_name }}"
      remote_src: yes
    ignore_errors: yes

  - name: 更新后端jar文件
    copy:
      src: "{{ src_jar_path }}"
      dest: "{{ deploy_path }}"
      mode: '0755'
  when: src_jar_path is not undefined

- block:
    - name: 复制目录，如果存在
      command: cp -r "{{ src_web_paths }}" "{{ deploy_update_path }}/backup_{{ timestamp }}/{{ app_name }}"
      ignore_errors: yes

    - name: 更新路径下的目录
      copy:
        src: "{{ src_web_paths }}"
        dest: "{{ deploy_web_path }}"
        mode: '0755'
      ignore_errors: yes
  when: src_web_paths is not undefined