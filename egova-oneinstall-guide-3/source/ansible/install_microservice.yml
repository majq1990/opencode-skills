---
# This playbook deploys the microservice
- name: configure and deploy the microservice
  hosts: "{{ host }}"
  gather_facts: "yes"
  remote_user: root
  # 优先级小于role/vars下定义的变量
  vars_files:
    - ./group_vars/all.yml
    # 注入微服务配置
    - ./inventory/template/ms_env_custom.yml
    - ./inventory/hosts.yml
    - ./inventory/eurbanpro_multi_server.yml
  roles:
    - local_repo
    - common
    - jdk
    - nginx
    - db_init
    - frontend
    - ms_custom
    - microservice
    - logrotate
    - flink_local_job