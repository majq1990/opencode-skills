software_tools:
  - name: jdk
    desc: jdk环境

  - name: mysql
    desc: MySQL数据库
    params:
      - name: ip
        desc: MySQL服务端IP
        default: 127.0.0.1
        display: 0 #安装时不可见
        access_conf: 1 #可录入
      - name: db_type
        desc: 数据库类型(业务库或统计库)
        default: biz
        display: 0
        access_conf: 0
      - name: port
        desc: MySQL监听端口
        default: 3306
        display: 1
        access_conf: 1
      - name: username
        default: root
        desc: MySQL用户名
        display: 0
        access_conf: 1
      - name: password
        default: Wk2uBTeyp6
        desc: MySQL密码
        display: 1
        access_conf: 1
      - name: data_dir
        desc: 数据存储目录
        default: /egova/db/mysql
        display: 1
      - name: temp_dir
        default: /egova/db/.mysql_temp
        desc: 临时目录
        display: 0

  - name: redis
    desc: Redis缓存数据库
    params:
      - name: ip
        desc: redis服务端IP
