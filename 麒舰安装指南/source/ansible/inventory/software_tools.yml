        access_conf: 1
      - name: secret_key
        default: Wk2uBTeyp6
        desc: minio超级用户密码
        display: 1
        access_conf: 1
      - name: catalog_user
        default: egovacatalog
        desc: catalog用户名
        display: 0
        access_conf: 0
      - name: catalog_password
        default: Wk2uBTeyp6
        desc: catalog密码
