eUrbanMIS:
  name: eUrbanMIS
  desc: 一网统管
  biz_type: MIS
  server_port: 8081
  base_path: /egova/web
  depends:
    - type: mysql
      name: 业务库
      database: cgdb
      sub_type: biz
      jdbc_type: default
    - type: mysql
      name: 统计库
      database: cgdbstat
      sub_type: stat
    - type: redis
      name: redis内存数据库
      database: 0
    - type: TDengine
      name: 时序数据库
      database: trace
    - type: zookeeper
      name: zookeeper
    - type: microservice
      sub_type: httpfileservice
      name: http共享目录服务
    - type: microservice
      sub_type: export
      name: export导出服务
    - type: kafka
      name: kafka消息队列


