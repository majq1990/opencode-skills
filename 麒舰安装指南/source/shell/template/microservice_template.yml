# 根据此模板生成对应的环境变量，注入到env文件中，service加载env文件，实现微服务启动参数注入
# arg_type区分传参类型， java:java -D传参方式， main_class:入口类传参方式
linglong:
  name: 灵珑
  category: basic
  display: 1
  # 10000是起始端口，自动计算
  server_port: 10000
  login_url: http://ip:8080/linglong/index.html
  user: admin
  password: eGova@2023Yhzx
  wiki: http://faq.egova.com.cn:7777/projects/redmine/wiki/%E7%81%B5%E7%8F%91%E4%B8%80%E9%94%AE%E9%83%A8%E7%BD%B2v2-%E5%BE%AE%E6%9C%8D%E5%8A%A1%E7%89%88
  base_path: /egova/apps/basic/linglong
  jar_name: magic-world.jar
  frontend_path: /egova/apps/basic/linglong/webApps
  proxy:
    - source: /linglong-api
      destination: /linglong-api
  url:
    backend: linglong-api
    frontend: linglong
  environment:
    jvm_opts: -Xms128m -Xmx4096m
  depends:
    - type: mysql
      # 子类型，对于mysql，可区分业务库和统计库
      sub_type: biz
      name: mysql业务库
      database: linglong
    - type: redis
      sub_type:
      name: redis
      database: 4
    - type: minio
      name: minio
      bucket_name: linglong
    - type: nacos
      name: nacos中心
    - type: microservice
      sub_type: usercenter
      name: 用户中心2.0
    - type: usercenter_redis
      name: usercenter_redis内存数据库
      database: 3
      sub_type: usercenter_redis


