---
# config logrotate
- name: Set the ansible_python_interpreter fact
  set_fact:
    ansible_python_interpreter: "/usr/bin/python3"
  when: ansible_pkg_mgr in ['dnf','apt']

- name: create logrotate config dir
  file:
    path: /etc/logrotate.d/egova
    state: directory
    mode: '0755'

- name: create logrotate.d config dir
  file:
    path: /etc/logrotate.d/egova/logrotate.d
    state: directory
    mode: '0755'

- name: 修改logrotate主入口
  blockinfile:
    path: /etc/logrotate.d/egova/logrotate.conf
    state: present
    create: yes
    marker: '# {mark} Ansible generated by oninstall_v2 logrotate'
    block: 'include /etc/logrotate.d/egova/logrotate.d/'

- name: 拷贝日志配置切割文件
  run_once: true
  template:
    src: "{{ item.filename }}.j2"
    dest: "{{ log_logrotate_config_path }}/{{ item.filename }}"
    mode: 0644
  with_items:
    - { filename: "nginx.conf"}
    - { filename: "redis.conf"}
    - { filename: "zookeeper.conf"}
    - { filename: "statgather.conf"}
    - { filename: "mysql.conf"}
    - { filename: "cetus.conf"}
    - { filename: "faceserver.conf"}
    - { filename: "syslog.conf"}
    - { filename: "nacos.conf"}



- name: config logrotate
  template: src=pub.logrotate.j2 dest={{ log_logrotate_config_path }}/{{ web_app_dir }}.conf mode=0644
  ignore_errors: yes

- name: 定时删除tomcat-{{ biz_type }}日志
  blockinfile:
    path: /etc/crontab
    state: present
    create: yes
    marker: '# {mark} Ansible generated by oninstall_v2 to remove /egova/tomcat-{{ biz_type }}/logs/ '
    block: '55 23 * * * root find /egova/tomcat-{{ biz_type }}/logs/ -type f \( -name "*.log" -o -name "*.txt" -o -name "*.out" \) -mtime +7 -exec rm -f {} \;'
  ignore_errors: yes
  when: biz_type is defined

- name: 修改crontab
  blockinfile:
    path: /etc/crontab
    state: present
    create: yes
    marker: '# {mark} Ansible generated by oninstall_v2 logrotate'
    block: '55 23 * * * root /usr/sbin/logrotate -f /etc/logrotate.d/egova/logrotate.conf # cron_logrotate_oninstall_v2}'
  notify: restart crond