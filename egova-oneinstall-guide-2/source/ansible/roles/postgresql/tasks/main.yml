- block:
    - name: Install PostGIS extensions
      become: true
      shell: >
        docker exec -i postgis35_13 su - postgres -c '
        createdb giscenter;
        psql --dbname="giscenter" --command "
        CREATE EXTENSION IF NOT EXISTS postgis;
        CREATE EXTENSION IF NOT EXISTS postgis_topology;
        CREATE EXTENSION IF NOT EXISTS postgis_sfcgal;
        CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;
        CREATE EXTENSION IF NOT EXISTS address_standardizer;
        CREATE EXTENSION IF NOT EXISTS address_standardizer_data_us;
        CREATE EXTENSION IF NOT EXISTS postgis_tiger_geocoder;
        CREATE EXTENSION IF NOT EXISTS pgrouting;
        "'
    - name: Copy SQL script to Docker container
      shell: >
        docker cp {{ dest_postgisdb_path }}/giscenter.sql postgis35_13:/tmp/giscenter.sql

    - name: Set PostgreSQL user password
      become: yes
      shell: |
        docker exec -i postgis35_13 su - postgres -c '
        psql --command "alter user postgres with password '\''{{ password }}'\'' ";
        '

    - name: Execute SQL script inside Docker container
      become: yes
      shell: |
        docker exec -i postgis35_13 su - postgres -c 'PGPASSWORD='{{ password }}' psql -h 127.0.0.1 --username=postgres -d giscenter -f /tmp/giscenter.sql'

  when: postgis_image_check.rc != 0 and ansible_distribution in ['Ubuntu','CentOS','UOS','openEuler','kylin_arm','kylin_x86','uos_x86','uos_arm','anolis_x86','anolis_arm']





  