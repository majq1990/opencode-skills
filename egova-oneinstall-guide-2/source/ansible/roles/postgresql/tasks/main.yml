---
#check if PostgreSQL exists
- name: Set the ansible_python_interpreter fact
  set_fact:
    ansible_python_interpreter: "/usr/bin/python3"
  when: ansible_pkg_mgr in ['dnf','apt']

- name: 检查目标目录
  stat: path={{ deploy_path }}/data
  register: postgresql_dir_result

- name: Fail if PostgreSQL is not empty
  fail:
    msg: |
      检查到已经安装过postgresql,如需卸载请在{{ hostvars[inventory_hostname]['ansible_ssh_host'] }}服务器上执行 rm -rf  {{ deploy_path }}/data
  ignore_errors: yes
  when: postgresql_dir_result.stat.exists == True

- name: Check if postgis image exists
  shell: docker images  | grep  "postgis"
  register: postgis_image_check
  ignore_errors: true

- name: Print message if postgis image exists
  debug:
    msg: "{{ postgis_image_check }}"

- block:
    - name: 准备postgresql目录
      file: name={{ item.dir }} state=directory owner={{ ops_user }} group={{ ops_user }} mode='{{ item.mode }}'
      with_items:
        - { dir: "{{ dest_path }}",mode: "0775" }
        - { dir: "{{ deploy_path }}",mode: "0775" }
    - name: copy package
      copy: src={{ src_path }}/postgis.tar dest={{ deploy_path }}

    - name: 镜像导入
      shell: "docker load -i {{ deploy_path }}/postgis.tar"

    - name: Copy docker-compose file
      become: true
      template:
        src: docker-compose.yaml.j2
        dest: "{{ deploy_path }}/docker-compose.yml"
        force: yes

    - name: Start postgis service with Docker Compose
      become: true
      command: docker-compose up -d
      args:
        chdir: "{{ deploy_path }}"

    - name: Set PostgreSQL config
      become: yes
      shell: |
        docker exec -i postgis35_13 su - postgres -c '
        sed -i "s/#listen_addresses = 'localhost'/listen_addresses = '*'/g" /var/lib/postgresql/data/postgresql.conf
        '
    - name: 修改配置
      template:
        src: "{{ item.filename }}.j2"
        dest: "{{ item.destpath }}"
        mode: '0644'
      with_items:
        - { filename: "pg_hba.conf",destpath: "{{ deploy_path }}/data/pg_hba.conf" }
      when: ansible_pkg_mgr in  ['dnf','yum']

    - name: Copy SQL script to Docker container
      shell: >
        docker cp {{ deploy_path }}/data/pg_hba.conf postgis35_13:/var/lib/postgresql/data

    - name: Restart the Docker container
      shell: docker restart postgis35_13
      become: true

  when: postgis_image_check.rc != 0 and ansible_distribution in ['Ubuntu','CentOS','UOS','openEuler','kylin_arm','kylin_x86','uos_x86','uos_arm','anolis_x86','anolis_arm']

