- name: 创建{{ dest_path }}目录
  file:
    path: "{{ dest_postgisdb_path }}"
    state: directory
    mode: '0755'

- name: Extract postgresdb.tar.gz
  unarchive:
    src: "{{ src_postgis_path }}/postgresdb.tar"
    dest: "{{ dest_postgisdb_path }}/"
    mode: '0755'

